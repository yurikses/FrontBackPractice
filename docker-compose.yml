services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - backend1
      - backend2
      - backend3

  backend1:
    build:
      context: .
      dockerfile: src/Dockerfile
    environment:
      - SERVER_ID=1
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    networks:
      - app-network
    depends_on:
      - redis

  backend2:
    build:
      context: .
      dockerfile: src/Dockerfile
    environment:
      - SERVER_ID=2
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    networks:
      - app-network
    depends_on:
      - redis

  backend3:
    build:
      context: .
      dockerfile: src/Dockerfile
    environment:
      - SERVER_ID=3
      - PORT=3002
      - REDIS_URL=redis://redis:6379
    networks:
      - app-network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis_data:/data

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
