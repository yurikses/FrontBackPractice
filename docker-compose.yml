
services:
  backend1:
    image: node:18
    working_dir: /app
    volumes:
      - .:/app
    command: node src/app.js
    environment:
      - PORT=3000
    ports:
      - "3000:3000"

  backend2:
    image: node:18
    working_dir: /app
    volumes:
      - .:/app
    command: node src/app.js
    environment:
      - PORT=3001
    ports:
      - "3001:3001"

  backend3:
    image: node:18
    working_dir: /app
    volumes:
      - .:/app
    command: node src/app.js
    environment:
      - PORT=3002
    ports:
      - "3002:3002"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3

  haproxy:
    image: haproxy:latest
    ports:
      - "8080:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - backend1
      - backend2
      - backend3

