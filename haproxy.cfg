global
    maxconn 2000

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend http_front
    bind *:80
    default_backend http_back

backend http_back
    balance roundrobin
    server server1 backend1:3000 check
    server server2 backend2:3001 check
    server server3 backend3:3002 check backup
